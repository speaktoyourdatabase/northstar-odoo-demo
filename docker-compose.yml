# Northstar demo company for Odoo 20 Community, by Speak To Your Database (speaktoyourdatabase.com/northstar).
# Unzip the package (northstar-odoo20.zip) into an empty folder, then run: docker compose up
# The first start restores the database (one or two minutes); later starts keep your data. When you see "Northstar is ready", open
# http://localhost:8069 (another port: NORTHSTAR_PORT=8079 docker compose up). Start over with the original data: docker compose down -v
# The database's own log is not shown here: docker compose logs db. Needs Docker Compose 2.20 or later.
# Odoo and PostgreSQL: the official images from Docker Hub.
#
# New days every night (optional, Northstar Live): docker compose --profile live up -d, then open http://localhost:8070 and click Pair.
# Without --profile live, nothing here connects to our service: the two services marked "profiles: [live]" do not start, and their image is not
# downloaded. Switched on later, Live uses this same install (same data, nothing to download again but the relay's small image).
name: northstar-demo

services:
  db:
    image: postgres:16
    attach: false
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${NORTHSTAR_DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # Runs once at each start: restores the database when it is not there yet, otherwise does nothing. Odoo's own technical lines go to a file in
  # this container (not to your window); a failure prints one plain line with the command that shows them.
  restore:
    image: odoo:20.0-20261102
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${NORTHSTAR_DB_PASSWORD:-odoo}
      LC_ALL: C.UTF-8
    volumes:
      - odoo-data:/var/lib/odoo
      - ./:/snapshot:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        log=/tmp/northstar-restore.log
        : > "$$log"
        fail() {
          echo "Northstar could not be restored: $$1 $$2 To see the details: docker compose cp restore:$$log northstar-restore.log"
          exit 1
        }
        if psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'northstar'" 2>>"$$log" | grep -q 1; then
          echo "Northstar database found: nothing to restore."
          exit 0
        fi
        zip=$$(ls -1 /snapshot/northstar-odoo20-*.zip 2>/dev/null | sort | tail -n 1 || true)
        if [ -z "$$zip" ]; then
          echo "Northstar could not be restored: no northstar-odoo20-*.zip next to docker-compose.yml. Unzip the whole Northstar package into an empty folder and run docker compose up there."
          exit 1
        fi
        name=$$(basename "$$zip")
        if [ -f /snapshot/SHA256SUMS ]; then
          want=$$(awk -v n="$$name" '$$2 == n { print $$1 }' /snapshot/SHA256SUMS)
          have=$$(sha256sum "$$zip" | cut -d' ' -f1)
          if [ -n "$$want" ] && [ "$$want" != "$$have" ]; then
            fail "the database file $$name does not match its checksum (the download is damaged)." "Download the package again, unzip it into an empty folder and run docker compose up."
          fi
        fi
        if ! python3 -c 'import sys, zipfile; sys.exit(1 if zipfile.ZipFile(sys.argv[1]).testzip() else 0)' "$$zip" 2>>"$$log"; then
          fail "the database file $$name is damaged." "Download the package again, unzip it into an empty folder and run docker compose up."
        fi
        echo "Restoring Northstar, about 1 to 2 minutes the first time."
        (
          odoo db --db_host db --db_user odoo load --force northstar_restoring "$$zip" &&
          odoo db --db_host db --db_user odoo rename --force northstar_restoring northstar
        ) >>"$$log" 2>&1 &
        pid=$$!
        t=0
        while kill -0 "$$pid" 2>/dev/null; do
          sleep 1
          t=$$((t + 1))
          if [ $$((t % 10)) -eq 0 ]; then
            echo "Still restoring, $$t s so far, usually 60 to 120 s."
          fi
        done
        if wait "$$pid"; then
          echo "Northstar restored in $$t s. Starting Odoo."
        else
          fail "the restore stopped after $$t s." "Run docker compose down -v, then docker compose up again; if it stops again, write to contact@speaktoyourdatabase.com with the details."
        fi
    restart: "no"

  odoo:
    image: odoo:20.0-20261102
    depends_on:
      restore:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${NORTHSTAR_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${NORTHSTAR_DB_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
    # Odoo logs warnings and errors only (its scheduled-job lines stay quiet). Two harmless lines of the official image are left out (the
    # extra-addons folder its configuration names, which holds nothing, and the missing markdown library of chat messages). The line below prints once, when Odoo answers.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        trap 'kill -TERM "$$pid" 2>/dev/null' TERM INT
        /entrypoint.sh odoo --log-level=warn --log-handler=odoo.tools.config:ERROR --log-handler=odoo.addons.mail.controllers.attachment:ERROR &
        pid=$$!
        (
          until python3 -c 'import urllib.request, sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8069/web/login", timeout=60).status == 200 else 1)' >/dev/null 2>&1; do
            sleep 2
          done
          echo "Northstar is ready: open http://localhost:${NORTHSTAR_PORT:-8069} and log in as admin / admin (more logins in the README). Stop with Ctrl+C."
        ) &
        wait "$$pid"
        wait "$$pid"
        exit $$?
    restart: unless-stopped

  # Northstar Live only (docker compose --profile live up -d). Runs once at each start of Live, never before the restore above has finished (it waits
  # for it to end well): makes (or checks) the Odoo API key the relay uses. The key is written to a volume only the relay mounts; it never leaves this
  # computer. Switched on later on an install that started without Live, it finds the database already there and only makes the key.
  live-init:
    image: odoo:20.0-20261102
    profiles: [live]
    user: root
    depends_on:
      db:
        condition: service_healthy
      restore:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${NORTHSTAR_DB_PASSWORD:-odoo}
      NORTHSTAR_DB: northstar
      RELAY_UID: "10001"
      NORTHSTAR_LIVE_PAGE_PORT: ${NORTHSTAR_LIVE_PAGE_PORT:-8070}
    volumes:
      - odoo-data:/var/lib/odoo
      - relay-key:/relay-key
      - ./init:/init:ro
    entrypoint: ["/bin/bash", "/init/init.sh"]
    restart: "no"

  # Northstar Live only: the relay. It connects out to our service, forwards only the daily-life calls it allows to the Odoo above and adds the key
  # itself. Its page, with the pairing code and the Pair button: http://localhost:8070 (on this computer only).
  northstar-live:
    image: ${NORTHSTAR_LIVE_IMAGE:-ghcr.io/speaktoyourdatabase/northstar-live:1.1.0@sha256:84804847fb52685b7278b4d8335cad7425960126af727ec7b1ec537e2ebd5c8d}
    profiles: [live]
    attach: false
    depends_on:
      live-init:
        condition: service_completed_successfully
      odoo:
        condition: service_started
    environment:
      NORTHSTAR_LIVE_URL: ${NORTHSTAR_LIVE_URL:-wss://live.speaktoyourdatabase.com/v1/relay}
      NORTHSTAR_LIVE_PAIR_URL: ${NORTHSTAR_LIVE_PAIR_URL:-https://speaktoyourdatabase.com/northstar/app}
      NORTHSTAR_LIVE_TRANSPORT: ${NORTHSTAR_LIVE_TRANSPORT:-auto}
      NORTHSTAR_LIVE_ODOO_URL: http://odoo:8069
      NORTHSTAR_LIVE_ODOO_DB: northstar
      NORTHSTAR_LIVE_KEY_FILE: /run/northstar-key/odoo_key
      NORTHSTAR_LIVE_PAGE: 0.0.0.0:8070
      NORTHSTAR_LIVE_PAGE_PORT: ${NORTHSTAR_LIVE_PAGE_PORT:-8070}
    ports:
      - "127.0.0.1:${NORTHSTAR_LIVE_PAGE_PORT:-8070}:8070"
    volumes:
      - relay-key:/run/northstar-key:ro
      - relay-state:/var/lib/northstar-live
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  relay-key:
  relay-state:
